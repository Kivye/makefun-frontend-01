<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>make.fun / Bounty desk</title><style>
*{box-sizing:border-box}body{margin:0;background:#101713;color:#e6eee8;font:14px system-ui}a{color:inherit;text-decoration:none}header,footer{display:flex;align-items:center;gap:24px;padding:0 24px;height:48px;border-bottom:1px solid #344439}header b{margin-right:auto}small,label,footer{color:#9cac9f;font-size:12px}main{display:grid;grid-template-columns:400px minmax(0,1fr);height:calc(100vh - 88px)}aside{border-right:1px solid #344439;overflow:auto;padding:22px 16px}article{overflow:auto;padding:24px 30px}h1{font-size:30px;letter-spacing:-1px;margin:12px 0}h2{font-size:16px}p{line-height:1.6}button{background:#243329;color:#d8e6dc;border:1px solid #4a6151;padding:7px 10px;cursor:pointer}.row{display:block;padding:17px 12px;border-bottom:1px solid #344439;border-left:3px solid transparent}.row.selected{background:#21392a;border-left-color:#acff72}.row b{display:block;margin-bottom:10px}.row span{display:flex;justify-content:space-between;font-size:12px;color:#acbcae}em{font-style:normal;color:#b4ff86;font-size:10px;margin-left:8px}.facts{display:flex;gap:24px;padding:14px 0;border-block:1px solid #344439;margin:16px 0}.facts strong{display:block;font-size:25px;color:#c5ff9d}.facts>div{flex:1}.columns{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:24px}.rail{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.reward{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #344439;font-size:12px}.check{padding:10px 0;border-bottom:1px solid #344439}.check b{color:#c5ff9d}nav{display:flex;gap:22px;margin:16px 0}nav a{color:#c5ff9d}footer{height:40px;justify-content:space-between;border-top:1px solid #344439}pre{white-space:pre-wrap;font:inherit;line-height:1.6}.rank{display:grid;grid-template-columns:35px minmax(0,1fr) 150px 70px;gap:12px;padding:10px 0;border-bottom:1px solid #344439}meter{width:100%;accent-color:#b4ff86}@media(max-width:900px){main{display:block;height:auto}aside{max-height:360px}header{gap:10px;padding:0 12px}article{padding:20px}.facts{gap:10px}.facts strong{font-size:20px}.columns{grid-template-columns:1fr}.rank{grid-template-columns:25px minmax(0,1fr) 80px 50px}footer{padding:8px;height:auto;gap:10px;flex-wrap:wrap}}
</style><header><b>make.fun <small>/ Bounty desk</small></b><span id="status">Connecting…</span><span id="clock"></span><small id="total"></small><small class="size"></small></header><main><aside><label>THE BOUNTY BOARD</label><h2>Pick your next build.</h2><button id="sort">Best odds ↗</button><div id="board"></div></aside><article id="view">Fetching public data…</article></main><footer><span class="size"></span><span id="count"></span><span id="fetched"></span></footer><script type="module">
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),get=async p=>{let r=await fetch('https://make.fun/api/'+p);if(!r.ok)throw Error();return r.json()},places=c=>Object.entries(c.rewards||{}),odds=c=>Math.max(1,Math.round(c.submissionCount/(places(c).length||1))),open=c=>Date.parse(c.deadline)>Date.now(),left=c=>{let s=Math.max(0,Math.floor((Date.parse(c.deadline)-Date.now())/1000));return s?`${Math.floor(s/86400)}d ${Math.floor(s/3600)%24}h ${Math.floor(s/60)%60}m ${s%60}s`:'Closed'},link=(c,t='bounty')=>'#/'+t+'/'+c.slug;
let items=[],selected,sorted=sessionStorage.sorted==='true',stamp=sessionStorage.stamp||(sessionStorage.stamp=new Date().toISOString());
fetch('shell.json').then(r=>r.ok?r.json():null).then(s=>{if(s)document.querySelectorAll('.size').forEach(e=>e.textContent=s.bytes+' B gzip-9 · one file')}).catch(()=>{});
function board(){let best=[...items].filter(open).sort((a,b)=>odds(a)-odds(b))[0];$('#sort').textContent=sorted?'Default order ↗':'Best odds ↗';$('#board').innerHTML=(sorted?[...items].sort((a,b)=>open(b)-open(a)||odds(a)-odds(b)):items).map(c=>`<a class="row ${c===selected?'selected':''}" href="${link(c)}"><b>${esc(c.title)}${c===best?'<em>VALUE</em>':''}</b><span><i>${money(c.potUsd)}</i><i>${c.submissionCount} entries</i><i>1 in ${odds(c)}</i></span><small>${left(c)} · Fee ${money(c.entryFeeUsd)}</small></a>`).join('')}
async function route(){window.__shotReady=false;let [,type,slug]=location.hash.split('/');selected=items.find(c=>c.slug===slug)||items.find(c=>c.slug==='makefun-frontend-01')||items[0];board();let c=selected;$('#status').textContent=open(c)?'● Accepting entries':'● Entries closed';$('#total').textContent=c.submissionCount+' entries';$('#clock').textContent=left(c);try{if(type==='leaderboard'||type==='profile'||type==='rules'){await(await import('./detail.js')).render({type,slug,c,get,esc,money,view:$('#view')})}else{$('#view').innerHTML=`<label>BOUNTY BRIEF / SHOULD I ENTER?</label><h1>${esc(c.title)}</h1><small>${esc(c.slug)} · ${esc(c.category)}</small><nav><a href="${link(c)}">Overview</a><a href="${link(c,'leaderboard')}">Leaderboard ↗</a><a href="${link(c,'rules')}">Full brief & rules ↗</a></nav><div class="facts"><div><label>LIVE POT</label><strong>${money(c.potUsd)}</strong></div><div><label>ENTRY FEE</label><strong>${money(c.entryFeeUsd)}</strong></div><div><label>TIME LEFT</label><strong style="font-size:18px">${left(c)}</strong></div></div><div class="facts"><div><label>FIELD</label><strong>${c.submissionCount}</strong>entries</div><div><label>PAID PLACES</label><strong>${places(c).length}</strong>places</div><div><label>CASH ODDS</label><strong>1 in ${odds(c)}</strong>cashes</div><div><label>POT / ENTRY</label><strong>${c.submissionCount?money(c.potUsd/c.submissionCount):'—'}</strong></div></div><small>Places vs entries, from live API counts. Not a prediction of skill or outcome.</small><div class="columns"><section><h2>Entry checklist</h2><div class="check"><b>✓</b> ${money(c.entryFeeUsd)} entry fee</div><div class="check"><b>${open(c)?'↗':'—'}</b> ${open(c)?'Submit before':'Deadline passed:'} ${esc(c.deadline)}</div><div class="check"><b>↗</b> Deliver the build described below</div><div class="check"><b>✓</b> ${places(c).length} paid places in the reward schedule</div><h2>The assignment</h2><p>${esc(c.description.split('\n\n')[0])}</p><a href="${link(c,'rules')}">Read all deliverables & requirements →</a></section><section><h2>Rewards / USD</h2><div class="rail">${places(c).map(([p,v])=>`<div class="reward"><span>#${p}</span><b>${money(c.rewardsNow?.find(r=>r.place==p)?.amountUsd??v)}</b></div>`).join('')}</div></section></div>`}window.__shotReady=true}catch{$('#view').textContent='Public data unavailable'}}
$('#sort').onclick=()=>{sorted=!sorted;sessionStorage.sorted=sorted;board()};onhashchange=route;setInterval(()=>{if(selected)$('#clock').textContent=left(selected)},1000);
try{items=(await get('competitions')).items;$('#count').textContent=items.length+' bounties loaded';$('#fetched').textContent='API fetched '+stamp;await route()}catch{$('#view').textContent='Public data unavailable'}
</script></html>
