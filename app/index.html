<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>make.fun — Bounty desk</title><style>
*{box-sizing:border-box}body{margin:0;background:#101714;color:#dbe8df;font:14px Arial}header,footer{padding:15px 24px;background:#19231e;display:flex;gap:24px;align-items:center}header{height:49px}b,a{color:#a7efbf}a{text-decoration:none}main{display:grid;grid-template-columns:400px 1fr;height:calc(100vh - 94px)}aside{border-right:1px solid #35463b;padding:20px;overflow:auto}article{padding:30px;overflow:auto;min-width:0}input,select{background:#202d25;color:inherit;border:1px solid #43574a;padding:10px;max-width:65%}nav a{display:block;border-bottom:1px solid #304337;padding:18px 12px}nav a.on{border-left:3px solid #a7efbf;background:#233a2b}small,label,footer{color:#99afa0;font-size:12px}h1{font-size:30px;margin:16px 0}h2{font-size:16px}section{display:flex;gap:24px;padding:20px 0;border-block:1px solid #35463b;flex-wrap:wrap}section strong{display:block;font-size:27px;color:#b8f5cb}p{line-height:1.6}ol{padding-left:20px;line-height:2}#rail{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}#rail span{background:#1e2d23;padding:8px}button{cursor:pointer}em{font-size:10px;color:#102218;background:#a7efbf;padding:3px;font-style:normal}footer{height:45px;justify-content:space-between}@media(max-width:899px){main{display:block;height:auto}header{height:auto;flex-wrap:wrap}aside{max-height:420px}article{padding:20px}}
</style><header><b>make.fun / Bounty desk</b><span id="state"></span><span id="tick"></span><span id="req">0 requests</span><small id="size"></small></header><main><aside><label>LIVE OPPORTUNITIES</label><h2>Find your next edge.</h2><input id="filter" placeholder="Filter bounties" aria-label="Filter bounties"> <select id="sort" aria-label="Sort"><option>Default</option><option>Best odds</option></select><nav id="board"></nav></aside><article id="view"></article></main><footer><span id="shell"></span><span id="count"></span><span id="stamp"></span></footer><script type="module">
let items=[],selected,n=0;const $=s=>document.getElementById(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),money=x=>'$'+Number(x||0).toFixed(2),places=c=>Object.keys(c.rewards||{}).length,odds=c=>Math.max(1,Math.round(c.submissionCount/(places(c)||1))),open=c=>Date.parse(c.deadline)>Date.now(),left=c=>{let s=Math.max(0,Math.floor((Date.parse(c.deadline)-Date.now())/1000));return s?Math.floor(s/86400)+'d '+Math.floor(s/3600)%24+'h '+Math.floor(s/60)%60+'m '+s%60+'s':'Closed'},get=async p=>{ $('req').textContent=++n+' requests';let r=await fetch(p);if(!r.ok)throw Error(r.status);return r.json()};
function rows(){let best=items.filter(open).sort((a,b)=>odds(a)-odds(b))[0],a=[...items];if($('sort').selectedIndex)a.sort((a,b)=>open(b)-open(a)||odds(a)-odds(b));$('board').innerHTML=a.filter(c=>c.title.toLowerCase().includes($('filter').value.toLowerCase())).map(c=>`<a class="${c===selected?'on':''}" href="#/bounty/${c.slug}">${esc(c.title)} ${c===best?'<em>VALUE</em>':''}<p><b>${money(c.potUsd)}</b> · ${c.submissionCount} entries · 1 in ${odds(c)}</p><small>${left(c)}</small></a>`).join('')}
function detail(c){$('view').innerHTML=`<label>BOUNTY BRIEF / SHOULD I ENTER?</label><h1>${esc(c.title)}</h1><p><a href="#/leaderboard/${c.slug}">View full leaderboard ↗</a></p><section>${[[money(c.potUsd),'Live pot'],[money(c.entryFeeUsd),'Entry fee'],[left(c),'Time left'],[c.submissionCount,'Entries'],[places(c),'Paid places'],['1 in '+odds(c),'Cashes']].map(([v,k])=>`<div><strong>${v}</strong><small>${k}</small></div>`).join('')}</section><p>${money(c.submissionCount?c.potUsd/c.submissionCount:0)} pot per entry · Places vs entries, from live API counts.</p><h2>Entry checklist</h2><ol><li>${money(c.entryFeeUsd)} fee ${+c.entryFeeUsd?'required':'· no payment required'}</li><li>${open(c)?'Accepting entries until':'Deadline passed:'} ${esc(c.deadline)}</li><li>Deliver: ${esc(c.description.split('\n')[0].slice(0,180))}… <a href="#brief">Read full brief ↓</a></li><li>${places(c)} paid places · ranked by competition rules</li></ol><h2>Rewards / every paid place</h2><div id="rail">${Object.entries(c.rewards||{}).map(([p,v])=>`<span><small>#${p}</small> <b>${money(c.rewardsNow?.find(r=>r.place==p)?.amountUsd??v)}</b></span>`).join('')}</div><details id="brief"><summary>Full brief & rules</summary><p style="white-space:pre-wrap">${esc(c.description)}</p></details>`;$('view').querySelector('a[href="#brief"]').onclick=e=>{e.preventDefault();$('brief').open=true;$('brief').scrollIntoView()}}
async function route(){window.__shotReady=false;try{let [,kind,id]=location.hash.split('/');selected=items.find(c=>c.slug===id)||items.find(c=>c.slug==='makefun-frontend-01')||items[0];rows();$('state').textContent=(open(selected)?'● Open':'● Closed')+' · '+selected.submissionCount+' entries';$('tick').textContent=left(selected);if(kind==='leaderboard'||kind==='profile')await(await import('./detail.js')).render(kind,id,{get,esc,money,view:$('view'),selected});else detail(selected);window.__shotReady=true}catch(e){$('view').textContent='Public data unavailable';window.__shotReady=true}}
$('filter').oninput=rows;$('sort').onchange=rows;onhashchange=route;setInterval(()=>{if(selected)$('tick').textContent=left(selected)},1000);get('./shell.json').then(x=>{$('size').textContent=$('shell').textContent=x.bytes+' B gzip-9 · one file'}).catch(()=>{});get('https://make.fun/api/competitions').then(x=>{items=x.items;$('count').textContent=items.length+' bounties loaded';$('stamp').textContent='API fetched '+new Date().toISOString();route()}).catch(()=>{$('view').textContent='Public data unavailable';window.__shotReady=true});
</script>
