<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>make.fun Bounty desk</title><style>
*{box-sizing:border-box}body{margin:0;background:#f9fbfa;color:#18251e;font:13px Arial;--g:#168052;--line:#dce5df}a{color:inherit;text-decoration:none}header,footer{padding:14px;display:flex;justify-content:space-between;border-block:1px solid var(--line);background:white}footer,.sub,.meta,.label{font-size:11px;color:#627369}h1{font-size:22px;margin:8px 0}h2{font-size:13px}.grid{display:grid;grid-template-columns:420px 1fr;min-height:710px}aside{padding:12px;border-right:1px solid var(--line)}main{padding:18px;min-width:0}button,input,.pill{background:white;border:1px solid var(--line);padding:6px;color:inherit;font:11px Arial;cursor:pointer}input{width:100%;margin:9px 0}.controls{display:flex;gap:4px;margin:6px 0}.on{color:var(--g)}.row{display:grid;grid-template-columns:1fr 85px;padding:8px;border-top:1px solid var(--line);height:48px}.row.sel{border-left:3px solid var(--g);background:#edf7f0}.row b{font-size:12px}.row .sub{margin-top:4px;font-size:10px}.row>span:last-child{text-align:right}em{color:var(--g);font-size:9px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.fact{border:1px solid var(--line);background:white;padding:12px}.fact strong{display:block;font-size:24px;margin-top:6px}.hero,.head{display:flex;justify-content:space-between;align-items:center}.sections{display:grid;grid-template-columns:1fr 1fr;gap:22px}.check{padding:10px 0;border-bottom:1px solid var(--line)}.reward{height:20px;display:grid;grid-template-columns:30px 1fr 65px;gap:10px;align-items:center;font-size:11px}.bar{height:5px;background:#e2ebe5}.bar i{display:block;height:100%;background:var(--g)}.odds{padding:14px 0;border-block:1px solid var(--line);line-height:2}.odds b{font-size:23px;color:var(--g)}@media(max-width:900px){.grid{display:block}header{flex-wrap:wrap}.sections{grid-template-columns:1fr}}
</style><header><a href="#/"><b>make.fun Bounty desk</b></a><span id="live"></span><span id="counter"></span></header><div id="app"></div><footer><span id="size"></span><span id="loaded"></span><span id="updated"></span></footer><script type="module">
let data=[],sel='makefun-frontend-01',sort=0,category='',query='',cache=new Map,stats={req:0,n304:0,mem:0},$=s=>document.querySelector(s),root=$('#app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),usd=n=>'$'+(+n||0).toFixed(2),open=x=>Date.parse(x.deadline)>Date.now(),left=x=>{let t=Math.max(0,Date.parse(x.deadline)-Date.now());return t?Math.floor(t/864e5)+'d '+Math.floor(t%864e5/36e5)+'h':'Closed'},paid=x=>Object.keys(x.rewards||{}).length,odds=x=>Math.max(1,Math.round(x.submissionCount/(paid(x)||1))),paintCount=()=>$('#counter').textContent=`${stats.req} API requests · ${stats.n304} unchanged (304) · ${stats.mem} from memory`,button=(t,k,v)=>`<button data-${k}="${v}">${t}</button>`,fact=(k,v)=>`<div class="fact"><span class="label">${k}</span><strong>${v}</strong></div>`;
async function get(p,refresh=false){let c=cache.get(p);if(c&&!refresh){stats.mem++;paintCount();return c.data}stats.req++;paintCount();let r=await fetch('https://make.fun/api'+p,{headers:c?.tag?{'If-None-Match':c.tag}:{}});if(r.status===304){stats.n304++;paintCount();return c.data}if(!r.ok)throw Error(r.status);let data=await r.json();cache.set(p,{data,tag:r.headers.get('etag')});return data}
function detail(x){return `<div class="hero"><div><span class="label">${x.status} / ${esc(x.category)}</span><h1>${esc(x.title)}</h1></div><a class="pill" href="#/leaderboard/${x.slug}">Standings ↗</a></div><div class="facts">${[['Live pot',usd(x.potUsd)],['Entry fee',usd(x.entryFeeUsd)],['Time left',left(x)],['Entries',x.submissionCount]].map(v=>fact(...v)).join('')}</div><div class="sections"><section><h2>SHOULD I ENTER?</h2><div class="odds"><b>1 in ${odds(x)} cashes</b><br>${x.submissionCount} entries · ${paid(x)} paid places<br>${usd(x.potUsd/(x.submissionCount||1))} pot per entry<div class="sub">Places vs entries, from live API counts</div></div><h2>ENTRY CHECKLIST</h2>${['Fee · '+usd(x.entryFeeUsd),'Deadline · '+new Date(x.deadline).toLocaleString(),'Deliver · '+(x.skills||[]).join(', '),paid(x)+' paid places'].map(t=>`<div class="check">✓ ${esc(t)}</div>`).join('')}<p><a class="pill" href="#/brief/${x.slug}">Full brief & rules →</a></p></section><section><h2>REWARDS / EVERY PAID PLACE</h2>${x.rewardsNow.map(v=>`<div class="reward"><span>#${v.place}</span><div class="bar"><i style="width:${v.amountUsd/x.potUsd*500}%"></i></div><b>${usd(v.amountUsd)}</b></div>`).join('')}<p class="sub">Live amounts include base pot + fee share.</p></section></div>`}
function render(){window.__shotReady=false;let [_,view,slug]=location.hash.split('/'),ctx={root,slug,get,data,stats,paintCount,esc,usd};if(view==='leaderboard'){import('./views/leaderboard.js').then(m=>m.render(ctx));return}if(view==='profile'){import('./views/profile.js').then(m=>m.render(ctx));return}if(view==='brief'){import('./views/brief.js').then(m=>m.show(get,slug,root));return}if(slug)sel=slug;let x=data.find(v=>v.slug===sel)||data[0],a=data.filter(v=>v.title.toLowerCase().includes(query)&&(!category||v.category===category)),best=data.filter(open).sort((a,b)=>odds(a)-odds(b))[0];a.sort((a,b)=>+open(b)-+open(a)||(sort===1?b.potUsd-a.potUsd:sort===2?b.submissionCount-a.submissionCount:sort===3?odds(a)-odds(b):Date.parse(a.deadline)-Date.parse(b.deadline)));root.innerHTML=`<div class="grid"><aside><b>${data.filter(open).length} live bounties</b> · ${usd(data.filter(open).reduce((n,v)=>n+ +v.potUsd,0))} live pots<div class="sub">${data.reduce((n,v)=>n+v.submissionCount,0)} total entries</div><input id="filter" placeholder="Type to filter bounties…" value="${esc(query)}"><div class="controls">${['Closing soon','Biggest pot','Most entries','Best odds'].map((t,i)=>button(t,'sort',i)).join('')}</div><div class="controls">${['All','Code','Growth','Games','Trading'].map(t=>button(t,'cat',t==='All'?'':t)).join('')}</div>${a.map(v=>`<a class="row ${v===x?'sel':''}" href="#/bounty/${v.slug}"><span><b>${esc(v.title.slice(0,40))}</b>${v===best?'<em> VALUE</em>':''}<div class="sub">${left(v)} · ${v.submissionCount} entries · 1 in ${odds(v)}</div></span><span><b>${usd(v.potUsd)}</b><div class="sub">${esc(v.category)}</div></span></a>`).join('')}</aside><main>${detail(x)}</main></div>`;$('#filter').oninput=e=>{query=e.target.value.toLowerCase();render();$('#filter').focus()};for(let k of ['sort','cat'])root.querySelectorAll('[data-'+k+']').forEach(b=>b.onclick=()=>{if(k==='sort')sort=+b.dataset[k];else category=b.dataset[k];render()});window.__shotReady=true}
onhashchange=render;setInterval(()=>{let x=data.find(v=>v.slug===sel);if(x)$('#live').textContent=x.status+' · '+left(x)+' · '+x.submissionCount+' entries'},1000);get('/competitions').then(x=>{data=x.items;$('#loaded').textContent=data.length+' bounties loaded';$('#updated').textContent='API fetched '+new Date().toISOString().slice(11,19)+' UTC';render()}).catch(()=>{root.innerHTML='<main>Public data unavailable</main>';window.__shotReady=true});fetch('./shell.json').then(r=>r.json()).then(x=>$('#size').textContent=x.bytes+' B gzip-9 · one file · 3 lazy views').catch(()=>{});window.desk={get};
